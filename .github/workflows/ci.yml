name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: テスト（TZ=UTC）
        run: TZ=UTC node --test tests/*.test.mjs
      - name: 外部への通信がないかの確認（C-01）
        run: |
          if grep -rnE "https?://" src/ | grep -vE "sikumilab\.com"; then echo "外部URLが含まれています"; exit 1; fi
